<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Электромонтёр — АРМ ЭТЛ 2027</title>
  <style>
    :root { --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --mut:#64748b; --pri:#1d4ed8; --ok:#059669; --warn:#d97706; --err:#dc2626; --bdr:#cbd5e1; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); padding-bottom:28px; }
    header { position:sticky; top:0; z-index:30; background:#0f172a; color:#fff; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
    header .t { font-weight:700; font-size:15px; }
    header .s { font-size:11px; color:#94a3b8; }
    .pill { display:inline-block; padding:4px 9px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap; }
    .p-ok { background:#dcfce7; color:#166534; }
    .p-warn { background:#fef3c7; color:#92400e; }
    .p-err { background:#fee2e2; color:#991b1b; }
    .wrap { max-width:680px; margin:0 auto; padding:10px; }
    .card { background:var(--card); border:1px solid #e2e8f0; border-radius:14px; padding:14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(15,23,42,.05); }
    input, select, textarea { width:100%; padding:11px; border:1px solid var(--bdr); border-radius:10px; font-size:15px; font-family:inherit; background:#fff; margin-bottom:8px; }
    label.lbl { display:block; font-size:12px; font-weight:700; color:#334155; margin:4px 0 4px; }
    .btn { border:0; border-radius:12px; padding:13px 16px; font-size:15px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; }
    .btn-pri { background:var(--pri); color:#fff; }
    .btn-ok { background:var(--ok); color:#fff; }
    .btn-warn { background:var(--warn); color:#fff; }
    .btn-err { background:var(--err); color:#fff; }
    .btn-sec { background:#e2e8f0; color:var(--ink); }
    .btn-sm { padding:9px 12px; font-size:13px; border-radius:9px; width:auto; }
    .act-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0; }
    .act-btn { border:0; border-radius:14px; padding:16px 10px; font-size:15px; font-weight:800; color:#fff; cursor:pointer; text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px; box-shadow:0 2px 6px rgba(15,23,42,.12); }
    .act-btn small { font-size:11px; font-weight:500; opacity:.92; }
    .act-to { background:#1d4ed8; }
    .act-tr { background:#0284c7; }
    .act-test { background:#7c3aed; }
    .act-hrs { background:#059669; }
    .act-def { background:#dc2626; grid-column:1 / -1; }
    .chk-row { display:flex; align-items:flex-start; gap:10px; padding:9px 8px; border-bottom:1px solid #f1f5f9; font-size:14px; cursor:pointer; }
    .chk-row input[type=checkbox] { width:22px; height:22px; margin:0; flex-shrink:0; accent-color:var(--pri); }
    .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .between { justify-content:space-between; }
    .hidden { display:none !important; }
    .mut { color:var(--mut); font-size:13px; }
    .toast { position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:99; background:#0f172a; color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; font-weight:700; box-shadow:0 6px 20px rgba(0,0,0,.3); max-width:92vw; text-align:center; }
    #qrVideo { width:100%; border-radius:12px; background:#000; max-height:300px; object-fit:cover; }
    .eq-banner { background:#eff6ff; border:1.5px solid #93c5fd; border-radius:12px; padding:12px; margin-bottom:10px; }
    .res-item { padding:10px 0; border-bottom:1px solid #f1f5f9; cursor:pointer; }
    .res-item:last-child { border-bottom:0; }
    .norm-box { padding:9px 12px; border-radius:10px; font-size:13px; font-weight:700; margin-bottom:10px; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="t">АРМ ЭТЛ • Электромонтёр</div>
      <div class="s" id="hdrUser">ООО «Сургут перевалка»</div>
    </div>
    <div class="row" style="gap:6px;">
      <span id="hdrStatus" class="pill p-warn" onclick="showScreen('setup')">Настройка</span>
    </div>
  </header>

  <div class="wrap">
    <!-- SCREEN 1: CONNECTION & LOGIN -->
    <section id="scr-setup" class="card">
      <h3 style="margin:0 0 8px;">Подключение к серверу ПК и вход</h3>
      <label class="lbl">IP или HTTPS-адрес сервера</label>
      <input id="cfgUrl" placeholder="Например: http://192.168.1.45:8080 или https://..." />
      <label class="lbl">Ваше ФИО (будет записано в паспорт)</label>
      <input id="cfgFio" placeholder="Например: Иванов И.И." />
      <div class="grid2">
        <div><label class="lbl">Логин</label><input id="cfgLogin" value="monter" /></div>
        <div><label class="lbl">Пароль</label><input id="cfgPass" type="password" value="2027" /></div>
      </div>
      <button class="btn btn-pri" onclick="connectAndLogin()">Подключиться и войти</button>
      <button class="btn btn-sec" style="margin-top:8px;" onclick="workOfflineMode()">Работать автономно (очередь без сети)</button>
      <div id="setupMsg" class="mut" style="margin-top:8px;"></div>
    </section>

    <!-- SCREEN 2: SCAN QR / SELECT OBJECT -->
    <section id="scr-scan" class="hidden">
      <div class="card">
        <div class="row between" style="margin-bottom:8px;">
          <strong style="font-size:15px;">Выбор объекта по QR-бирке</strong>
          <button class="btn btn-sec btn-sm" onclick="showScreen('setup')">Настройки</button>
        </div>
        <button class="btn btn-pri" id="btnStartCam" onclick="startQrScanner()">Сканировать QR камерой</button>
        <div id="qrCamBox" class="hidden" style="margin-top:10px;">
          <video id="qrVideo" playsinline autoplay muted></video>
          <div id="qrCamHint" class="mut" style="margin:6px 0;">Наведите камеру на QR-бирку оборудования...</div>
          <button class="btn btn-sec btn-sm" onclick="stopQrScanner()">Закрыть камеру</button>
        </div>
        <div style="margin-top:12px;">
          <label class="lbl">Или ручной поиск (инв. №, EQ-код, название, объект):</label>
          <div class="row">
            <input id="qManual" style="flex:1;margin:0;" placeholder="Например: ED-REG-001 или ЗУ-1.29" oninput="renderQuickSearch()" />
            <button class="btn btn-ok btn-sm" onclick="resolveManualCode()">Открыть</button>
          </div>
          <div id="qResults" style="margin-top:6px;"></div>
        </div>
      </div>

      <!-- QUEUE PANEL -->
      <div id="queueCard" class="card hidden">
        <div class="row between">
          <div>
            <strong>Очередь отправки на ПК: <span id="qCnt">0</span></strong>
            <div class="mut">Данные сохранены в телефоне и ждут передачи</div>
          </div>
          <button class="btn btn-warn btn-sm" onclick="flushQueueOnline()">Отправить</button>
        </div>
        <button class="btn btn-sec btn-sm" style="margin-top:8px;width:100%;" onclick="exportQueueFile()">Сохранить очередь в файл (Bluetooth)</button>
      </div>
    </section>

    <!-- SCREEN 3: OBJECT ACTION HUB -->
    <section id="scr-obj" class="hidden">
      <div class="eq-banner">
        <div class="row between">
          <strong id="obName" style="font-size:15px;">Оборудование</strong>
          <button class="btn btn-sec btn-sm" onclick="backToScan()">Другой QR</button>
        </div>
        <div id="obMeta" class="mut" style="margin-top:4px;"></div>
        <div id="obScheme" class="mut" style="margin-top:4px;color:#1e3a8a;"></div>
      </div>

      <div id="actHub">
        <div class="act-grid">
          <button class="act-btn act-to" onclick="openAction('to')">ТО<small>Чек-лист обслуживания</small></button>
          <button class="act-btn act-tr" onclick="openAction('tr')">ТР<small>Чек-лист ремонта</small></button>
          <button class="act-btn act-test" onclick="openAction('test')">Испытания<small>Rиз + R обмоток</small></button>
          <button class="act-btn act-hrs" onclick="openAction('hours')">Моточасы<small>Наработка (Разд. 12)</small></button>
          <button class="act-btn act-def" onclick="openAction('defect')">Фото дефекта<small>Камера + Журнал дефектов на ПК</small></button>
        </div>
      </div>

      <!-- FORM CONTAINER -->
      <div id="actFormCard" class="card hidden"></div>
    </section>
  </div>

  <div id="toastEl" class="toast hidden"></div>

  <script>
    const CHECKLIST_TO = [
      'Внешний осмотр корпуса, креплений, фундаментных болтов и защитного кожуха (отсутствие трещин и ослаблений)',
      'Очистка корпуса, рёбер охлаждения, клеммной коробки / щита от пыли, грязи и влаги',
      'Проверка целостности и затяжки защитного заземления (видимая связь корпус — шина PE/ЗУ)',
      'Контроль нагрева подшипниковых узлов, корпуса и контактов; отсутствие постороннего шума и вибрации',
      'Осмотр кабельного ввода, сальников и целостности взрывозащищённой оболочки / Ex-маркировки',
      'Проверка состояния пусковой аппаратуры, индикации, маркировки и бирок',
      'Для ЗУ и молниезащиты: осмотр молниеприёмников, токоотводов, сварных соединений и антикоррозийного покрытия'
    ];
    const CHECKLIST_TR = [
      'Вскрытие клеммной коробки / шкафа, ревизия, зачистка и протяжка силовых и контрольных клемм',
      'Добавление / замена смазки подшипников или замена подшипников (указать тип в примечании)',
      'Ревизия или замена коммутационной / защитной аппаратуры (автомат, контактор, тепловое реле, ЧП)',
      'Ремонт кабельного ввода, замена уплотнений / сальников, восстановление Ex-поверхностей',
      'Восстановление контура заземления, металлосвязи или антикоррозийного покрытия',
      'Протяжка креплений агрегата, проверка полумуфты / соосности / ременной передачи',
      'Контрольный замер сопротивления изоляции после ремонта и пробный пуск под нагрузкой'
    ];
    const CHECKLIST_TEST = [
      'Напряжение снято, отсутствие напряжения проверено, установлены ПЗ и плакаты (ПОТЭЭ № 903н)',
      'Проверен срок поверки и исправность прибора СИ',
      'Остаточный заряд снят, испытательные провода отсоединены'
    ];

    const CFG_KEY = 'ARM_ETL_FIELD_CFG_V1';
    const QUEUE_KEY = 'ARM_ETL_FIELD_QUEUE_V1';
    let CATALOG = [];
    let CFG = { url: '', fio: 'Электромонтёр', login: 'monter', token: '', online: false };
    let QUEUE = [];
    let CUR_OBJ = null;
    let CUR_PHOTO_B64 = '';
    let QR_STREAM = null;
    let QR_TIMER = null;

    function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function todayIso() { return new Date().toISOString().slice(0,10); }
    function toast(msg) {
      const el = document.getElementById('toastEl');
      el.textContent = msg; el.classList.remove('hidden');
      clearTimeout(window._tt); window._tt = setTimeout(() => el.classList.add('hidden'), 2800);
    }

    function loadLocal() {
      try { CATALOG = JSON.parse(document.getElementById('offlineCatalog').textContent || '[]'); } catch(e) { CATALOG = []; }
      try { Object.assign(CFG, JSON.parse(localStorage.getItem(CFG_KEY) || '{}')); } catch(e) {}
      try { QUEUE = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch(e) { QUEUE = []; }
      // Auto-detect server URL if opened directly from server (/field)
      if (!CFG.url && location.protocol.startsWith('http')) {
        CFG.url = location.origin;
      }
      document.getElementById('cfgUrl').value = CFG.url || '';
      document.getElementById('cfgFio').value = CFG.fio || '';
      document.getElementById('cfgLogin').value = CFG.login || 'monter';
      updateHeader();
      updateQueueUi();
      if (CFG.token && CFG.url) {
        showScreen('scan');
      } else {
        showScreen('setup');
      }
    }

    function saveCfg() { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); updateHeader(); }
    function saveQueue() { localStorage.setItem(QUEUE_KEY, JSON.stringify(QUEUE)); updateQueueUi(); }

    function updateHeader() {
      document.getElementById('hdrUser').textContent = (CFG.fio || 'Электромонтёр') + (CFG.url ? ' • ' + CFG.url.replace(/^https?:\/\//,'') : ' • Автономно');
      const st = document.getElementById('hdrStatus');
      if (CFG.online && CFG.token) { st.textContent = 'ОНЛАЙН'; st.className = 'pill p-ok'; }
      else if (QUEUE.length) { st.textContent = 'Очередь: ' + QUEUE.length; st.className = 'pill p-warn'; }
      else { st.textContent = 'ОФЛАЙН'; st.className = 'pill p-warn'; }
    }

    function updateQueueUi() {
      const card = document.getElementById('queueCard');
      document.getElementById('qCnt').textContent = QUEUE.length;
      card.classList.toggle('hidden', QUEUE.length === 0);
      updateHeader();
    }

    function showScreen(name) {
      stopQrScanner();
      ['setup','scan','obj'].forEach(s => document.getElementById('scr-' + s).classList.toggle('hidden', s !== name));
    }

    async function connectAndLogin() {
      const url = document.getElementById('cfgUrl').value.trim().replace(/\/+$/, '');
      const fio = document.getElementById('cfgFio').value.trim() || 'Электромонтёр';
      const login = document.getElementById('cfgLogin').value.trim() || 'monter';
      const password = document.getElementById('cfgPass').value;
      const msg = document.getElementById('setupMsg');
      if (!url) { msg.textContent = 'Укажите IP или HTTPS-адрес сервера ПК.'; return; }
      msg.textContent = 'Подключение к ' + url + '...';
      try {
        const res = await fetch(url + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Ошибка входа (' + res.status + ')');
        CFG = { url, fio: fio || (data.user && data.user.full_name) || login, login, token: data.token || '', online: true };
        saveCfg();
        msg.textContent = '';
        toast('Подключено к серверу ПК!');
        showScreen('scan');
        if (QUEUE.length) flushQueueOnline();
      } catch(e) {
        CFG.online = false; saveCfg();
        msg.textContent = 'Нет связи с сервером: ' + e.message + '. Можно нажать «Работать автономно».';
      }
    }

    function workOfflineMode() {
      CFG.fio = document.getElementById('cfgFio').value.trim() || 'Электромонтёр';
      CFG.url = document.getElementById('cfgUrl').value.trim().replace(/\/+$/, '');
      CFG.online = false;
      saveCfg();
      showScreen('scan');
      toast('Автономный режим включён');
    }

    // --- QR SCANNER (BarcodeDetector on HTTPS/Android + graceful fallback) ---
    async function startQrScanner() {
      const box = document.getElementById('qrCamBox');
      const hint = document.getElementById('qrCamHint');
      box.classList.remove('hidden');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        hint.textContent = 'Камера недоступна по HTTP — используйте HTTPS или введите код/инв. № вручную ниже.';
        return;
      }
      try {
        QR_STREAM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const vid = document.getElementById('qrVideo');
        vid.srcObject = QR_STREAM;
        await vid.play();
        if ('BarcodeDetector' in window) {
          const det = new BarcodeDetector({ formats: ['qr_code'] });
          hint.textContent = 'Наведите камеру на QR-бирку...';
          QR_TIMER = setInterval(async () => {
            try {
              const codes = await det.detect(vid);
              if (codes && codes.length) {
                const raw = codes[0].rawValue;
                stopQrScanner();
                resolveCode(raw);
              }
            } catch(e) {}
          }, 350);
        } else {
          hint.textContent = 'В этом браузере автодетектор QR не поддерживается — откройте в Chrome (HTTPS) или введите инв. № ниже.';
        }
      } catch(e) {
        hint.textContent = 'Нет доступа к камере (' + e.message + '). Введите инв. № или EQ-код вручную ниже.';
      }
    }

    function stopQrScanner() {
      if (QR_TIMER) { clearInterval(QR_TIMER); QR_TIMER = null; }
      if (QR_STREAM) { QR_STREAM.getTracks().forEach(t => t.stop()); QR_STREAM = null; }
      const box = document.getElementById('qrCamBox');
      if (box) box.classList.add('hidden');
    }

    function renderQuickSearch() {
      const q = (document.getElementById('qManual').value || '').toLowerCase().trim();
      const box = document.getElementById('qResults');
      if (q.length < 2) { box.innerHTML = ''; return; }
      const hits = CATALOG.filter(e => (e.name + ' ' + e.obj + ' ' + e.inv + ' ' + e.sc + ' ' + e.ser).toLowerCase().includes(q)).slice(0, 8);
      box.innerHTML = hits.map(e => `
        <div class="res-item" onclick="selectCatalogObj('${esc(e.id)}')">
          <div style="font-weight:700;font-size:14px;">${esc(e.name)}</div>
          <div class="mut">${esc(e.obj)} • Инв. ${esc(e.inv || '—')} ${e.sc ? '• '+esc(e.sc) : ''}</div>
        </div>`).join('') || '<div class="mut">В локальной базе не найдено — нажмите «Открыть» для поиска на сервере</div>';
    }

    function selectCatalogObj(id) {
      const item = CATALOG.find(x => x.id === id);
      if (item) openObjectCard(item);
    }

    async function resolveManualCode() {
      const q = document.getElementById('qManual').value.trim();
      if (!q) return toast('Введите код, инв. № или название');
      resolveCode(q);
    }

    async function resolveCode(raw) {
      const q = String(raw || '').trim();
      // 1. Try server online first
      if (CFG.url && CFG.online) {
        try {
          const r = await fetch(CFG.url + '/api/field/resolve?code=' + encodeURIComponent(q), {
            headers: CFG.token ? { 'X-Auth-Token': CFG.token } : {}
          });
          if (r.ok) {
            const d = await r.json();
            const eq = d.equipment || {}, p = d.passport || {};
            openObjectCard({
              id: eq.id, obj: eq.object_name, name: eq.name,
              inv: p.inventory_no || eq.num || '', ser: p.serial_no || '', sc: p.short_code || '',
              s1: p.sec_1_scheme || '', s3: p.sec_3_rza || '', hrs: d.last_hours || ''
            });
            return;
          }
        } catch(e) { /* fallback to offline catalog */ }
      }
      // 2. Fallback to offline catalog
      const mUrl = q.match(/\/eq\/([A-Za-z0-9_-]+)/);
      const clean = (mUrl ? mUrl[1] : q).toLowerCase();
      const found = CATALOG.find(e =>
        (e.qr||'').toLowerCase() === clean ||
        (e.sc||'').toLowerCase() === clean ||
        (e.inv||'').toLowerCase() === clean ||
        (e.id||'').toLowerCase() === clean
      ) || CATALOG.find(e => (e.name + ' ' + e.obj + ' ' + e.inv + ' ' + e.ser).toLowerCase().includes(clean));
      if (!found) return toast('Объект «' + q + '» не найден');
      openObjectCard(found);
    }

    function openObjectCard(obj) {
      CUR_OBJ = obj;
      document.getElementById('obName').textContent = obj.name;
      document.getElementById('obMeta').textContent = `${obj.obj} • Инв. ${obj.inv || '—'} • Зав. ${obj.ser || '—'}${obj.hrs ? ' • Наработка: ' + obj.hrs + ' ч' : ''}`;
      document.getElementById('obScheme').textContent = [obj.s1, obj.s3].filter(Boolean).join(' | ');
      document.getElementById('actFormCard').classList.add('hidden');
      document.getElementById('actHub').classList.remove('hidden');
      showScreen('obj');
    }

    function backToScan() {
      document.getElementById('qManual').value = '';
      document.getElementById('qResults').innerHTML = '';
      showScreen('scan');
    }

    function closeActionForm() {
      document.getElementById('actFormCard').classList.add('hidden');
      document.getElementById('actHub').classList.remove('hidden');
    }

    function toggleAllChecks(val) {
      document.querySelectorAll('#actFormCard input[type=checkbox].cl-item').forEach(cb => cb.checked = val);
    }

    function openAction(act) {
      CUR_PHOTO_B64 = '';
      document.getElementById('actHub').classList.add('hidden');
      const card = document.getElementById('actFormCard');
      card.classList.remove('hidden');

      if (act === 'to' || act === 'tr') {
        const list = act === 'to' ? CHECKLIST_TO : CHECKLIST_TR;
        const title = act === 'to' ? 'ТО — Техническое обслуживание' : 'ТР — Текущий ремонт';
        card.innerHTML = `
          <div class="row between" style="margin-bottom:8px;">
            <strong style="font-size:15px;">${title}</strong>
            <button class="btn btn-sec btn-sm" onclick="closeActionForm()">Назад</button>
          </div>
          <div class="row" style="margin-bottom:8px;">
            <button class="btn btn-sec btn-sm" onclick="toggleAllChecks(true)">Отметить всё</button>
            <button class="btn btn-sec btn-sm" onclick="toggleAllChecks(false)">Снять всё</button>
          </div>
          <div>${list.map((txt, i) => `<label class="chk-row"><input type="checkbox" class="cl-item" value="${esc(txt)}" /><span>${esc(txt)}</span></label>`).join('')}</div>
          <label class="lbl" style="margin-top:10px;">${act === 'tr' ? 'Заменённые детали / примечание' : 'Примечание (при необходимости)'}</label>
          <textarea id="fNote" rows="2" placeholder="${act === 'tr' ? 'Например: заменён подшипник 6206-2Z' : 'Замечаний нет'}"></textarea>
          <button class="btn btn-ok" onclick="submitAction('${act}')">Сохранить и передать в паспорт</button>`;
      }
      else if (act === 'hours') {
        card.innerHTML = `
          <div class="row between" style="margin-bottom:8px;">
            <strong style="font-size:15px;">Моточасы (Раздел 12 паспорта)</strong>
            <button class="btn btn-sec btn-sm" onclick="closeActionForm()">Назад</button>
          </div>
          <div class="mut" style="margin-bottom:8px;">Предыдущее значение: <strong>${esc(CUR_OBJ.hrs || 'нет данных')} ч</strong></div>
          <label class="lbl">Текущая наработка, ч</label>
          <input id="fHours" type="number" step="0.1" placeholder="Например: 18500" />
          <label class="lbl">Примечание</label>
          <input id="fNote" placeholder="По счётчику ЧП / журнал смены" />
          <button class="btn btn-ok" onclick="submitAction('hours')">Сохранить моточасы</button>`;
      }
      else if (act === 'test') {
        card.innerHTML = `
          <div class="row between" style="margin-bottom:8px;">
            <strong style="font-size:15px;">Испытания: Rиз + R обмоток</strong>
            <button class="btn btn-sec btn-sm" onclick="closeActionForm()">Назад</button>
          </div>
          <div>${CHECKLIST_TEST.map(txt => `<label class="chk-row"><input type="checkbox" class="cl-item" checked value="${esc(txt)}" /><span>${esc(txt)}</span></label>`).join('')}</div>
          <div class="grid2" style="margin-top:8px;">
            <div>
              <label class="lbl">Uисп мегаомметра, В</label>
              <select id="fUTest"><option value="500">500 В</option><option value="1000" selected>1000 В</option><option value="2500">2500 В</option></select>
            </div>
            <div>
              <label class="lbl">R изоляции, МОм</label>
              <input id="fRIso" type="number" step="0.1" placeholder="Напр. 500" oninput="recalcTestNorm()" />
            </div>
          </div>
          <label class="lbl">Сопротивление обмоток постоянному току, Ом (норма разброса ≤ 2%)</label>
          <div class="grid3">
            <input id="fRab" type="number" step="0.001" placeholder="R AB" oninput="recalcTestNorm()" />
            <input id="fRbc" type="number" step="0.001" placeholder="R BC" oninput="recalcTestNorm()" />
            <input id="fRca" type="number" step="0.001" placeholder="R CA" oninput="recalcTestNorm()" />
          </div>
          <div id="testNormBox" class="norm-box hidden"></div>
          <label class="lbl">Примечание</label>
          <input id="fNote" placeholder="Прибор СИ / условия" />
          <button class="btn btn-ok" onclick="submitAction('test')">Сохранить испытания в паспорт</button>`;
      }
      else if (act === 'defect') {
        card.innerHTML = `
          <div class="row between" style="margin-bottom:8px;">
            <strong style="font-size:15px;">Фото дефекта (в Журнал дефектов ПК)</strong>
            <button class="btn btn-sec btn-sm" onclick="closeActionForm()">Назад</button>
          </div>
          <label class="btn btn-warn" style="margin-bottom:8px;">
            Сделать фото дефекта (камера)
            <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="handleDefectPhoto(this.files[0])" />
          </label>
          <img id="photoPreview" class="hidden" style="width:100%;max-height:240px;object-fit:contain;border-radius:10px;border:1px solid #cbd5e1;margin-bottom:8px;" />
          <div id="photoInfo" class="mut" style="margin-bottom:8px;"></div>
          <label class="lbl">Описание дефекта</label>
          <textarea id="fNote" rows="3" placeholder="Опишите неисправность (коррозия, нагрев, подтёк, вибрация...)"></textarea>
          <button class="btn btn-err" onclick="submitAction('defect')">Отправить дефект и фото на ПК</button>`;
      }
    }

    function recalcTestNorm() {
      const box = document.getElementById('testNormBox');
      const rIso = parseFloat((document.getElementById('fRIso').value || '').replace(',','.'));
      const vals = ['fRab','fRbc','fRca'].map(id => parseFloat((document.getElementById(id).value || '').replace(',','.'))).filter(v => !isNaN(v) && v > 0);
      let msgs = [], ok = true;
      if (!isNaN(rIso)) {
        if (rIso >= 0.5) msgs.push('Rиз = ' + rIso + ' МОм (норма ≥ 0,5)');
        else { msgs.push('Rиз = ' + rIso + ' МОм — НИЖЕ НОРМЫ!'); ok = false; }
      }
      if (vals.length >= 2) {
        const avg = vals.reduce((a,b) => a+b, 0) / vals.length;
        const spread = ((Math.max(...vals) - Math.min(...vals)) / avg) * 100;
        msgs.push('Разброс обмоток: ' + spread.toFixed(2) + '%' + (spread <= 2 ? ' (норма ≤ 2%)' : ' — ПРЕВЫШЕНИЕ!'));
        if (spread > 2) ok = false;
      }
      if (!msgs.length) { box.classList.add('hidden'); return; }
      box.classList.remove('hidden');
      box.style.background = ok ? '#dcfce7' : '#fee2e2';
      box.style.color = ok ? '#166534' : '#991b1b';
      box.textContent = msgs.join(' | ');
    }

    function handleDefectPhoto(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const maxW = 1024;
          let w = img.width, h = img.height;
          if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          CUR_PHOTO_B64 = cv.toDataURL('image/jpeg', 0.72);
          const prev = document.getElementById('photoPreview');
          prev.src = CUR_PHOTO_B64; prev.classList.remove('hidden');
          document.getElementById('photoInfo').textContent = 'Фото сжато: ~' + Math.round(CUR_PHOTO_B64.length * 0.75 / 1024) + ' КБ';
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    async function submitAction(act) {
      const checks = Array.from(document.querySelectorAll('#actFormCard input.cl-item:checked')).map(c => c.value);
      const noteEl = document.getElementById('fNote');
      const ev = {
        client_event_id: 'ev-' + Date.now() + '-' + Math.random().toString(36).slice(2,7),
        equipment_id: CUR_OBJ.id,
        action: act,
        date: todayIso(),
        performer: CFG.fio || 'Электромонтёр',
        checklist: checks,
        note: noteEl ? noteEl.value.trim() : ''
      };
      if (act === 'hours') {
        ev.hours = (document.getElementById('fHours').value || '').trim();
        if (!ev.hours) return alert('Введите моточасы');
        CUR_OBJ.hrs = ev.hours;
      } else if (act === 'test') {
        ev.u_test = document.getElementById('fUTest').value;
        ev.r_iso = (document.getElementById('fRIso').value || '').trim();
        ev.r_ab = (document.getElementById('fRab').value || '').trim();
        ev.r_bc = (document.getElementById('fRbc').value || '').trim();
        ev.r_ca = (document.getElementById('fRca').value || '').trim();
        if (!ev.r_iso && !ev.r_ab && !ev.r_bc && !ev.r_ca) return alert('Введите Rиз или сопротивление обмоток');
      } else if (act === 'defect') {
        if (!ev.note && !CUR_PHOTO_B64) return alert('Сделайте фото или опишите дефект');
        ev.photo_b64 = CUR_PHOTO_B64;
      }

      // Try instant online send to PC server
      if (CFG.url && CFG.token) {
        try {
          const res = await fetch(CFG.url + '/api/field/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Auth-Token': CFG.token },
            body: JSON.stringify(ev)
          });
          if (res.ok) {
            CFG.online = true; saveCfg();
            toast('Записано в паспорт на ПК!');
            closeActionForm();
            return;
          }
        } catch(e) {
          CFG.online = false; saveCfg();
        }
      }
      // Offline queue fallback
      QUEUE.push(ev);
      saveQueue();
      toast('Нет сети — сохранено в очередь (' + QUEUE.length + ')');
      closeActionForm();
    }

    async function flushQueueOnline() {
      if (!QUEUE.length) return;
      if (!CFG.url || !CFG.token) { toast('Сначала подключитесь к серверу в Настройках'); showScreen('setup'); return; }
      try {
        const res = await fetch(CFG.url + '/api/field/sync-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Auth-Token': CFG.token },
          body: JSON.stringify({ events: QUEUE })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Ошибка ' + res.status);
        QUEUE = [];
        saveQueue();
        CFG.online = true; saveCfg();
        toast('Отправлено на ПК: ' + data.accepted + ' записей');
      } catch(e) {
        toast('Не удалось отправить: ' + e.message);
      }
    }

    function exportQueueFile() {
      const fname = `electrician_queue_${todayIso()}.json`;
      const blob = new Blob([JSON.stringify({ format: 'ARM_ETL_FIELD_QUEUE_V1', events: QUEUE }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = fname; a.click();
      toast('Очередь сохранена в файл ' + fname);
    }

    loadLocal();
  </script>
</body>
